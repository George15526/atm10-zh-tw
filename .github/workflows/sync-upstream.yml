# 每天比對上游 chiba233/atm10-zh-cn 的 main，有新提交就開一個「同步上游」的 PR。
#
# 分支直接指向上游的 main，不在這裡合併：有衝突時 PR 頁面會顯示，人工解完再合。
# 兩個 GitHub 的限制：
# - GITHUB_TOKEN 開的 PR 不會觸發 pull_request 工作流。CI 要靠關閉再重新開啟 PR 觸發。
# - GITHUB_TOKEN 不能推改了 .github/workflows/ 的提交。上游改到工作流時推送會被拒，
#   這時改開 issue，請人手動同步。
name: sync-upstream

on:
  schedule:
    - cron: '0 1 * * *'   # 台灣時間 09:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 比對上游，有新提交就開 PR
        run: |
          set -euo pipefail
          UP=$(python3 -c "import json;print(json.load(open('src/zh_tw/config.json'))['upstream_repo'])")
          git remote add upstream "https://github.com/$UP.git"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "✅ 已包含上游 main 的全部提交"; exit 0
          fi

          SHA=$(git rev-parse --short=8 upstream/main)
          N=$(git rev-list --count HEAD..upstream/main)
          BR="chore/sync-upstream-$SHA"
          TITLE="chore: 同步上游 $UP（$N 個提交，至 $SHA）"
          if [ -n "$(gh pr list --head "$BR" --state all --json number -q '.[].number')" ]; then
            echo "ℹ️ $BR 已經開過 PR"; exit 0
          fi

          {
            echo "上游 [$UP](https://github.com/$UP) 有 $N 個新提交。"
            echo
            echo '## 合併前'
            echo
            echo '1. 關閉再重新開啟本 PR，觸發 CI。Actions 開的 PR 不會自動跑 CI。'
            echo '2. 合併方式選 **Create a merge commit**，不要 squash。squash 會丟掉上游的提交歷史，下次同步會在同一批改動上再衝突。'
            echo '3. 有衝突時，先把 main 合進本分支、解完衝突再推送：'
            echo
            echo '   ```bash'
            echo "   git fetch origin && git switch $BR && git merge origin/main"
            echo '   ```'
            echo
            echo '合併後到 Actions → zh_tw 出包，version 填上游的新版本號加 `.1`（例：`r27.1`）。'
            echo
            echo '## 上游的新提交'
            echo
            echo '```'
            git log --oneline --no-decorate HEAD..upstream/main | head -100
            echo '```'
          } > body.md

          if git push origin "upstream/main:refs/heads/$BR"; then
            gh pr create --base main --head "$BR" --title "$TITLE" --body-file body.md
          else
            echo "⚠️ 推送被拒，多半是上游改了 .github/workflows/。改開 issue。"
            if [ -n "$(gh issue list --state open --search "in:title $SHA" --json number -q '.[].number')" ]; then
              echo "ℹ️ 已有同一版的 issue"; exit 0
            fi
            {
              echo "上游的新提交改到了 \`.github/workflows/\`，GITHUB_TOKEN 推不上去，請手動同步："
              echo
              echo '```bash'
              echo "git fetch upstream && git switch -c $BR origin/main && git merge upstream/main"
              echo "git push -u origin $BR"
              echo '```'
              echo
              sed -n '/^## 上游的新提交/,$p' body.md
            } > issue.md
            gh issue create --title "$TITLE" --body-file issue.md
          fi
