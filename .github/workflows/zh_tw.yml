# atm10-zh-tw — 繁體中文（台灣）版出包
#
# 先呼叫 build.yml，從本倉庫的 src/ 建出簡體 zip，再轉成繁體 zip。
# 本倉庫在 src/ 的修正因此直接進繁體包，不必等上游發版。
#
# 手動觸發：Actions → zh_tw → Run workflow，填版本號（例：r26.1）。
name: zh_tw

on:
  workflow_dispatch:
    inputs:
      version:
        description: '繁體包版本號：合併到的上游版本 + 本倉庫的修正次數（例：r26.1）'
        required: true
      mc_versions:
        description: '要出的整合包版本，空白分隔。只出實機驗證過的版本（目前 8.1）'
        default: '8.1'
      fill_from_mods:
        description: '用各版模組 jar 自帶的 zh_cn 補位（Minecraft 的 zh_tw 不會回退到 zh_cn）'
        type: boolean
        default: true
      publish:
        description: '建立 release（tag 為 v<版本號>）並上傳繁體包'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  simplified:
    uses: ./.github/workflows/build.yml
    with:
      patch_version: ${{ inputs.version }}
      targets: ${{ inputs.mc_versions }}

  tw:
    needs: simplified
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ inputs.version }}
      MC_VERSIONS: ${{ inputs.mc_versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝依賴（釘雜湊）
        run: |
          python -m pip install --require-hashes -r requirements-zh_tw.lock
          python -m pip install --require-hashes -r requirements.lock   # Pillow：重繪按鈕圖

      - name: 取繁體字型（核雜湊）
        run: python scripts/zh_tw/fetch_fonts_tw.py

      - name: 繁體任務書橫幅（對著該版官方原圖重繪）
        run: |
          set -euo pipefail
          python scripts/fetch_pack.py 8.1 build/packsrc/8.1 --no-jars
          ATM_PACK_ROOT=build/packsrc/8.1 python scripts/zh_tw/gen_banners_tw.py

      - name: 反例測試
        run: python scripts/zh_tw/test_zh_tw.py

      - uses: actions/download-artifact@v4
        with:
          name: atm10-zh_cn-${{ inputs.version }}
          path: zh_cn

      - name: 核對簡體包
        run: |
          set -euo pipefail
          for mc in $MC_VERSIONS; do
            [ "$(ls zh_cn/*-atm${mc}.zip 2>/dev/null | wc -l)" -eq 2 ] \
              || { echo "❌ 簡體建包沒有產出 ${mc} 的 client + server 兩個 zip"; exit 1; }
          done
          ls -la zh_cn

      - name: 轉換
        run: |
          set -euo pipefail
          mkdir -p dist
          for z in zh_cn/atm10-zh_cn-*.zip; do
            mc=$(basename "$z" | sed -E 's/.*-atm([0-9.]+)\.zip$/\1/')
            fill=()
            if [ "${{ inputs.fill_from_mods }}" = "true" ] && [[ "$z" == *-client-* ]]; then
              [ -d "pack-$mc/mods" ] || python scripts/fetch_pack.py "$mc" "pack-$mc"
              fill=(--mods "pack-$mc/mods")
            fi
            python scripts/zh_tw/build_tw.py "$z" --out dist --banners build/zh_tw/questpics "${fill[@]}"
            # 每版約 480 個 jar，七個版本全留著會撐爆 runner 的磁碟（約 14 GB），轉完就刪
            if [[ "$z" == *-client-* ]]; then rm -rf "pack-$mc"; fi
            df -h . | tail -1
          done

      - name: 閘門（殘留簡體字 + 骨架不變）
        run: python scripts/zh_tw/check_tw.py dist/atm10-zh_tw-*.zip --against zh_cn/atm10-zh_cn-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: atm10-zh_tw-${{ inputs.version }}
          path: dist/atm10-zh_tw-*.zip

      - name: 發布
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/atm10-zh_tw-*.zip \
            --title "ATM10 繁體中文（台灣）版 $TAG" \
            --notes "安裝方式見包內「請安裝前務必看我.md」。"
